<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>0</h1>
    <button onclick="increase()">Count</button>

    <script>
        let count = 0;
        let heading = document.querySelector('h1');

        function increase() {
            count++;
            heading.innerHTML = count;
        }
    </script>
</body>
</html>
