<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>

         let counter = 0;

        function count() {
            counter = counter + 1;
            alert(counter);
        }
    </script>
    <title>Document</title>
</head>
<body>
    <h1>Hello, World!</h1>
    <button onclick="count()">Click here</button>
</body>
</html>
