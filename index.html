<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function count() {
        if (document.querySelector('h1').innerHTML === 'Hello, World') {
            document.querySelector('h1').innerHTML = 'Hello, Universe';
        }
        else {
            document.querySelector('h1').innerHTML = 'Hello, World';
        }   
    }
    </script>
</head>
<body>
    <h1>Hello, World</h1>
    <button onclick="count()">click here</button>
</body>
</html>
